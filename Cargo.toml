[package]
name = "stem_core"
version = "0.1.1"
edition = "2024"
description = "Magnetic core definition for stem - a Simulation Toolbox for Electric Motors."
readme = "README.md"
license  = "MIT OR Apache-2.0"
repository = "https://github.com/StefanMathis/stem_core.git"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
approxim = { version = "0.6" }
compare_variables = { version = "0.3.0", features = ["proc_macro"] }
stem_magnet = { version = "0.4" }
stem_slot = { path = "../stem_slot" }
num = {version = "0.4"}
rayon = "1.5"
serde_mosaic = { version = "0.3", optional = true }
deserialize_untagged_verbose_error = { version = "0.1.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
dyn-clone = "1"
typetag = { version = "^0.2", optional = true }
embed-doc-image = { version = "0.1.4", optional = true }

[features]
default = []
serde = ["dep:serde_mosaic","dep:deserialize_untagged_verbose_error", "dep:serde", "dep:typetag", "stem_slot/serde"]
cairo = ["stem_slot/cairo", "stem_magnet/cairo"]
doc-images = ["dep:embed-doc-image"]

[dev-dependencies]
indoc = "1.0"
yaml_serde = "0.10.6"
cairo_viewport = { version = "0.3", features = ["image-compare"]}
stem_core = { path = ".", features = ["serde", "cairo"] }

[package.metadata.docs.rs]
features = ["serde", "cairo", "doc-images"]
rustdoc-args = ["--cfg", "docsrs"]